name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.5']
        jit: ['1']
        include:
          # shared hosts often run without the PCRE JIT
          - php: '8.3'
            jit: '0'
    name: PHP ${{ matrix.php }}${{ matrix.jit == '0' && ' (no PCRE JIT)' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          ini-values: pcre.jit=${{ matrix.jit }}
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
